services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoconecta}
      POSTGRES_USER: ${POSTGRES_USER:-ecoconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Docker no publica puertos de un contenedor conectado solo a redes internas.
    networks: [database, development]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.31.0
    profiles: [openwa]
    restart: unless-stopped
    environment:
      SSRF_ALLOWED_HOSTS: api
      MEDIA_DOWNLOAD_ENABLED: "true"
      MEDIA_DOWNLOAD_MAX_BYTES: "5242880"
      RESOLVE_LID_TO_PHONE: "true"
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "5242880"
      WEBHOOK_MAX_PAYLOAD_BYTES: "8388608"
      WEBHOOK_TIMEOUT: "60000"
    volumes: [openwa_data:/app/data]
    ports: ["127.0.0.1:2785:2785"]
    networks: [outbound]
  adminer:
    image: adminer:6.3.0
    profiles: [tools]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks: [database, development]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  web:
    build:
      context: ./frontend
      args:
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    profiles: [app]
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    networks: [database, outbound]
    depends_on:
      api:
        condition: service_healthy
  api:
    build: .
    profiles: [app]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ecoconecta}
      PGUSER: ${DB_APP_USER:-ecoconecta_app}
      PGPASSWORD: ${DB_APP_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TOKEN_MINUTES: ${TOKEN_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DB_PANEL_USER: ${DB_PANEL_USER:-ecoconecta_panel}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      OPENWA_URL: ${OPENWA_URL:-http://openwa:2785}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      ECO_IA_URL: ${ECO_IA_URL:-}
      ECO_IA_TIMEOUT: ${ECO_IA_TIMEOUT:-15}
      OUTBOX_INTERVALO: ${OUTBOX_INTERVALO:-15}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
    ports: ["127.0.0.1:8000:8000"]
    networks: [database, outbound]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  db-setup:
    build: .
    profiles: [setup]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ecoconecta}
      PGUSER: ${POSTGRES_USER:-ecoconecta}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      DB_APP_USER: ${DB_APP_USER:-ecoconecta_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DB_PANEL_USER: ${DB_PANEL_USER:-ecoconecta_panel}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD:-}
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -ec, 'test -n "$DB_APP_PASSWORD" || { echo "Defina DB_APP_PASSWORD en .env" >&2; exit 1; }; alembic upgrade head && python -m scripts.provision_runtime']
volumes:
  openwa_data:
  postgres_data:
networks:
  database:
    internal: true
  development:
  outbound:
